<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
    <title>EchoTalk M1 隔离媒体探针</title>
    <script
      defer
      src="./vendor/livekit-client.umd.js"
      integrity="sha256-gAsBOwoMn4uBlNdiJb89yYNwKHOfpkEhUGixEmJ+3RU="
    ></script>
    <script type="module" src="./main.mjs"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">EchoTalk · M1</p>
      <h1>原生登录与隔离媒体探针</h1>
      <p>通过系统浏览器登录，回到此窗口查看结果。</p>
      <p id="auth-status" class="status" role="status">正在检查登录状态</p>
      <p id="auth-detail" aria-live="polite"></p>
      <button id="login" type="button" disabled>系统浏览器登录</button>
      <button id="cancel" type="button" disabled>取消 / 退出登录</button>
      <section aria-labelledby="media-heading">
        <h2 id="media-heading">隔离语音验证</h2>
        <p>仅用户点击开始后请求麦克风；连接成功不代表双向实际有声。</p>
        <p id="media-status" class="status" role="status" aria-live="polite">正在检查媒体配置</p>
        <p id="media-detail" aria-live="polite"></p>
        <button id="media-start" type="button" disabled>开始语音</button>
        <button id="media-stop" type="button" disabled>结束</button>
        <button id="media-play" type="button" disabled>重试播放</button>
        <div id="media-audio-root"></div>
      </section>
    </main>
  </body>
</html>
