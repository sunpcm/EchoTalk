name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test-frontend:
    # Keep the historical check name stable for existing branch protection.
    name: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Match the locked Playwright version and the existing Ubuntu 26.04 runner.
      image: mcr.microsoft.com/playwright:v1.62.1-resolute@sha256:aebd85bce8056dcdc2269853fd94ea432b6a201da4f0ef125b509489ecd52ddb
      options: --user 1001 --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API types
        run: pnpm --filter vite-app check:api-types

      - name: Test API type generation
        run: pnpm --filter vite-app test:api-types

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm exec turbo run lint --force

      - name: Typecheck
        run: pnpm exec turbo run typecheck --force

      - name: Test (Vitest)
        run: pnpm --filter vite-app test

      - name: Test (Build Scripts)
        run: pnpm --filter vite-app test:build

      - name: Test (Fake API)
        run: pnpm --filter vite-app test:fake-api

      - name: Build
        run: pnpm exec turbo run build --force

      - name: Verify preinstalled Playwright browsers
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { existsSync } = require("node:fs");
          const { chromium, webkit } = require("@playwright/test");
          assert.equal(require("@playwright/test/package.json").version, "1.62.1");
          for (const browser of [chromium, webkit]) {
            assert.ok(existsSync(browser.executablePath()), `${browser.name()} executable missing`);
          }
          NODE
        working-directory: apps/vite-app

      - name: E2E Test (Playwright)
        run: pnpm exec playwright test
        working-directory: apps/vite-app

  test-backend:
    # Keep the historical check name stable for existing branch protection.
    name: test-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: echotalk
          POSTGRES_PASSWORD: echotalk_test
          POSTGRES_DB: echotalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echotalk -d echotalk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://echotalk:echotalk_test@localhost:5432/echotalk_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m venv "$RUNNER_TEMP/uv-tool"
          "$RUNNER_TEMP/uv-tool/bin/python" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: "uv==0.9.18"
          "$RUNNER_TEMP/uv-tool/bin/uv" --version
          echo "$RUNNER_TEMP/uv-tool/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-header --no-annotate --output-file /tmp/exported-requirements.txt
          cmp requirements.txt /tmp/exported-requirements.txt
          uv sync --frozen --group dev --no-python-downloads

      - name: Test keyfree runtime guards (offline)
        run: backend/.venv/bin/python -B -m unittest discover -s tools/keyfree-runtime -p 'test_*.py'

      - name: Check tracked OpenAPI schema
        working-directory: backend
        run: .venv/bin/python export_openapi.py --check

      - name: Check generated Provider display metadata
        working-directory: backend
        run: .venv/bin/python export_provider_metadata.py --check

      - name: Ruff format
        working-directory: backend
        run: .venv/bin/ruff format --check .

      - name: Ruff check
        working-directory: backend
        run: .venv/bin/ruff check .

      - name: Upgrade empty PostgreSQL database
        working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic current

      - name: Test with coverage
        working-directory: backend
        run: .venv/bin/pytest --cov=. --cov-report=term-missing

  test-macos-probe:
    name: test-macos-probe
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/macos-m1-native-probe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          architecture: arm64
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target aarch64-apple-darwin --no-self-update
      - name: Prepare locked isolated dependencies
        run: node scripts/ci.mjs prepare
      - name: Node and Rust tests plus unsigned arm64 app
        run: node scripts/ci.mjs

  test-ios-build:
    name: test-ios-build
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: "pnpm"
      - name: Prepare frozen pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Test iOS orchestration
        run: node --test --test-timeout=30000 apps/vite-app/scripts/ios-ci-test.mjs
      - name: Select Xcode and prepare locked SPM dependencies
        run: node apps/vite-app/scripts/ios-ci.mjs prepare
      - name: Production web, explicit sync and unsigned simulator compile
        run: node apps/vite-app/scripts/ios-ci.mjs
      - name: Preserve complete iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-logs
          path: .cache/ios-ci/logs/
          include-hidden-files: true
          if-no-files-found: warn

  ci:
    name: CI
    if: always()
    needs: [test-frontend, test-backend, test-macos-probe, test-ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all delivery gates
        env:
          FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          BACKEND_RESULT: ${{ needs.test-backend.result }}
          MACOS_PROBE_RESULT: ${{ needs.test-macos-probe.result }}
          IOS_BUILD_RESULT: ${{ needs.test-ios-build.result }}
        run: |
          test "$FRONTEND_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$MACOS_PROBE_RESULT" = "success"
          test "$IOS_BUILD_RESULT" = "success"
